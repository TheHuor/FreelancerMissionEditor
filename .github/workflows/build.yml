name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build MissionEditor.slnx --configuration Release
      - name: Test
        run: dotnet test MissionEditor.slnx --configuration Release --no-build
